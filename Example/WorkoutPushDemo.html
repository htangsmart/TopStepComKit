<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>运动推送 Demo</title>
<style>
  :root{color-scheme:light;--blue:#007aff;--red:#ff3b30;--page:#eef0f4;--surface:#fff;--text:#1c1c1e;--muted:#6e6e73;--line:#e5e5ea;--soft:#f6f7f9}
  *{box-sizing:border-box}body{margin:0;min-width:320px;background:var(--page);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",sans-serif}button{font:inherit}.stage{display:grid;place-items:start center;padding:24px 12px}.phone{position:relative;width:min(100%,430px);min-height:820px;overflow:hidden;background:#f2f2f7;border:1px solid #d1d1d6;border-radius:28px;box-shadow:0 18px 48px rgba(0,0,0,.14)}
  .nav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:58px;padding:8px 12px;background:rgba(249,249,249,.96);border-bottom:1px solid #d1d1d6}.nav strong{font-size:17px;font-weight:600}.link{padding:8px;border:0;border-radius:8px;color:var(--blue);background:transparent;cursor:pointer}.nav .link:last-child{justify-self:end}main{display:grid;gap:14px;padding:14px}.card{overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:14px}.section-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 9px}.section-head strong{font-size:16px;font-weight:600}.section-head small{color:var(--muted)}
  .status{display:flex;align-items:center;gap:10px;padding:12px 14px}.dot{width:10px;height:10px;flex:none;border-radius:50%;background:#34c759}.status-copy,.result-copy,.workout-copy,.device-copy{display:grid;gap:2px}.status-copy strong,.result-copy strong,.workout-copy strong,.device-copy strong{font-weight:500}small{color:var(--muted)}
  .cloud-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:2px 12px 14px}.workout{min-width:0;display:grid;grid-template-columns:auto 1fr;align-items:center;gap:9px;padding:12px 10px;color:inherit;text-align:left;background:var(--soft);border:1px solid #ececf0;border-radius:13px;cursor:pointer}.workout:active{transform:scale(.985)}.workout:focus-visible{outline:2px solid var(--blue)}.workout-icon{display:grid;place-items:center;width:38px;height:38px;border-radius:11px;background:var(--tone,#e8f3ff);font-size:21px}.workout-copy{min-width:0}.workout-copy strong,.workout-copy small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .device-row{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;min-height:58px;padding:9px 14px;border-top:1px solid var(--line)}.device-row:first-of-type{border-top:0}.slot-index{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;color:var(--blue);background:#eaf4ff}.tag{padding:4px 8px;border-radius:999px;color:var(--blue);background:#eaf4ff;font-size:12px}.tag.locked{color:var(--muted);background:#ededf1}.result-copy{padding:2px 14px 14px}
  .overlay{position:absolute;inset:0;z-index:5;display:grid;align-content:end;background:rgba(0,0,0,.34)}[hidden]{display:none!important}.sheet{max-height:90%;overflow:auto;background:#f2f2f7;border-radius:20px 20px 0 0;box-shadow:0 -12px 35px rgba(0,0,0,.14)}.sheet-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:54px;padding:7px 10px;background:rgba(249,249,249,.96);border-bottom:1px solid #d1d1d6}.sheet-head strong{font-size:17px;font-weight:600}.sheet-head .link{justify-self:end}.sheet-body{display:grid;gap:13px;padding:14px 14px 26px}.resource-summary{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:12px;padding:13px 14px;background:#fff;border:1px solid var(--line);border-radius:14px}.resource-summary .workout-icon{width:44px;height:44px;font-size:24px}
  .slot-title{margin:1px 2px -4px;font-weight:600}.slot-option{display:grid;grid-template-columns:auto auto 1fr;align-items:center;gap:10px;min-height:60px;padding:9px 13px;background:#fff;border-top:1px solid var(--line);cursor:pointer}.slot-option:first-child{border-top:0}.slot-option input{width:20px;height:20px;accent-color:var(--blue)}.slot-option.disabled{cursor:default;opacity:.55}.notice{margin:0;padding:10px 12px;border-radius:10px;color:#53535a;background:#e8e8ed;font-size:13px}.primary,.cancel{width:100%;min-height:48px;border-radius:12px;font-weight:500;cursor:pointer}.primary{color:#fff;background:var(--blue);border:0}.primary:disabled{color:#8e8e93;background:#d1d1d6;cursor:default}.cancel{color:var(--red);background:transparent;border:1px solid var(--red)}.operation{text-align:center}.spinner{width:30px;height:30px;margin:5px auto;border:3px solid #d1d1d6;border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite}.progress-head{display:flex;justify-content:space-between;gap:12px;text-align:left}progress{width:100%;accent-color:var(--blue)}@keyframes spin{to{transform:rotate(360deg)}}
  @media(max-width:460px){.stage{padding:0}.phone{min-height:100vh;border:0;border-radius:0;box-shadow:none}}@media(max-width:350px){.cloud-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="stage">
  <section class="phone" aria-label="运动推送 Demo 原型">
    <nav class="nav"><button class="link" type="button">‹ 返回</button><strong>运动推送</strong><button class="link" id="refreshButton" type="button">刷新</button></nav>
    <main>
      <section class="card"><div class="status"><span class="dot"></span><div class="status-copy"><strong>Fit Watch 已连接</strong><small id="deviceDetail">支持运动推送 · 2 个槽位可替换</small></div></div></section>
      <section class="card" aria-labelledby="cloudTitle">
        <div class="section-head"><div><strong id="cloudTitle">可推送运动</strong><br><small>适用于当前设备</small></div><button class="link" id="localFileButton" type="button">本地文件 ›</button></div>
        <div class="cloud-grid" id="cloudGrid">
          <button class="workout cloud-workout" type="button" data-name="跳绳" data-size="618 KB" data-icon="🪢"><span class="workout-icon" style="--tone:#fff1d8">🪢</span><span class="workout-copy"><strong>跳绳</strong><small>618 KB</small></span></button>
          <button class="workout cloud-workout" type="button" data-name="篮球" data-size="572 KB" data-icon="🏀"><span class="workout-icon" style="--tone:#ffe9dc">🏀</span><span class="workout-copy"><strong>篮球</strong><small>572 KB</small></span></button>
          <button class="workout cloud-workout" type="button" data-name="网球" data-size="596 KB" data-icon="🎾"><span class="workout-icon" style="--tone:#e9f7d7">🎾</span><span class="workout-copy"><strong>网球</strong><small>596 KB</small></span></button>
          <button class="workout cloud-workout" type="button" data-name="羽毛球" data-size="540 KB" data-icon="🏸"><span class="workout-icon" style="--tone:#e9efff">🏸</span><span class="workout-copy"><strong>羽毛球</strong><small>540 KB</small></span></button>
          <button class="workout cloud-workout" type="button" data-name="棒球" data-size="604 KB" data-icon="⚾️"><span class="workout-icon" style="--tone:#f1edff">⚾️</span><span class="workout-copy"><strong>棒球</strong><small>604 KB</small></span></button>
          <button class="workout cloud-workout" type="button" data-name="力量训练" data-size="632 KB" data-icon="🏋️"><span class="workout-icon" style="--tone:#e6f5f2">🏋️</span><span class="workout-copy"><strong>力量训练</strong><small>632 KB</small></span></button>
        </div>
      </section>
      <section class="card" aria-labelledby="deviceTitle">
        <div class="section-head"><div><strong id="deviceTitle">设备运动</strong><br><small>安装成功后自动刷新</small></div><small>3 个</small></div>
        <div class="device-row" data-device-slot="1"><span class="slot-index">1</span><span class="device-copy"><strong>足球</strong><small>可替换槽位</small></span><span class="tag">可替换</span></div>
        <div class="device-row" data-device-slot="3"><span class="slot-index">3</span><span class="device-copy"><strong>自由训练</strong><small>可替换槽位</small></span><span class="tag">可替换</span></div>
        <div class="device-row"><span class="slot-index">5</span><span class="device-copy"><strong>户外跑步</strong><small>系统内置运动</small></span><span class="tag locked">内置</span></div>
      </section>
      <section class="card"><div class="section-head"><strong>最近操作</strong><small id="resultTime">14:32:08</small></div><div class="result-copy"><strong id="resultMain">资源和槽位加载成功</strong><small id="resultDetail">云端运动 6 个 · 可替换槽位 2 个</small></div></section>
    </main>
    <input id="fileInput" type="file" accept=".bin,.zip,application/octet-stream" hidden>
    <div class="overlay" id="overlay" hidden>
      <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
        <div class="sheet-head"><span></span><strong id="sheetTitle">安装运动</strong><button class="link" id="closeButton" type="button">关闭</button></div>
        <div class="sheet-body" id="confirmView">
          <div class="resource-summary"><span class="workout-icon" id="selectedIcon">🪢</span><span class="workout-copy"><strong id="selectedName">跳绳</strong><small id="selectedMeta">云端资源 · 618 KB</small></span></div>
          <div class="slot-title">选择要替换的运动</div>
          <div class="card">
            <label class="slot-option"><input type="radio" name="targetSlot" value="1" data-current="足球"><span class="slot-index">1</span><span class="device-copy"><strong>足球</strong><small>可替换槽位</small></span></label>
            <label class="slot-option"><input type="radio" name="targetSlot" value="3" data-current="自由训练"><span class="slot-index">3</span><span class="device-copy"><strong>自由训练</strong><small>可替换槽位</small></span></label>
            <div class="slot-option disabled"><span></span><span class="slot-index">5</span><span class="device-copy"><strong>户外跑步</strong><small>系统内置 · 不可替换</small></span></div>
          </div>
          <p class="notice" id="sourceNotice">云端资源由 SDK 下载，随后推送到设备。</p>
          <button class="primary" id="installButton" type="button" disabled>请先选择目标运动</button>
        </div>
        <div class="sheet-body operation" id="operationView" hidden>
          <div id="prepareView"><div class="spinner"></div><strong id="prepareTitle">正在准备运动资源…</strong><br><small>下载完成后将自动推送到设备</small></div>
          <div id="transferView" hidden><div class="progress-head"><strong id="progressText">正在推送到设备</strong><span id="progressPercent">0%</span></div><progress id="progressBar" max="100" value="0">0%</progress><small>请保持设备连接，不要退出当前页面。</small></div>
          <button class="cancel" id="cancelButton" type="button">取消推送</button>
        </div>
      </section>
    </div>
  </section>
</div>
<script>
(() => {
  const byId=id=>document.getElementById(id),fileInput=byId('fileInput'),overlay=byId('overlay'),confirmView=byId('confirmView'),operationView=byId('operationView'),prepareView=byId('prepareView'),transferView=byId('transferView');
  let resource=null,targetSlot=null,targetCurrent='',prepareTimer=null,transferTimer=null,finishTimer=null;
  const now=()=>new Date().toLocaleTimeString('zh-CN',{hour12:false});
  const setResult=(main,detail)=>{byId('resultMain').textContent=main;byId('resultDetail').textContent=detail;byId('resultTime').textContent=now()};
  const openResource=item=>{resource=item;targetSlot=null;document.querySelectorAll('[name="targetSlot"]').forEach(input=>input.checked=false);byId('selectedIcon').textContent=item.icon;byId('selectedName').textContent=item.name;byId('selectedMeta').textContent=`${item.source==='cloud'?'云端资源':'本地文件'} · ${item.size}`;byId('sourceNotice').textContent=item.source==='cloud'?'云端资源由 SDK 下载，随后推送到设备。':'本地文件不要求填写运动类型，安装结果以设备回读为准。';byId('sheetTitle').textContent=item.source==='cloud'?`安装${item.name}`:'推送本地运动';byId('installButton').disabled=true;byId('installButton').textContent='请先选择目标运动';confirmView.hidden=false;operationView.hidden=true;byId('closeButton').hidden=false;overlay.hidden=false};
  document.querySelectorAll('.cloud-workout').forEach(button=>button.addEventListener('click',()=>openResource({source:'cloud',name:button.dataset.name,size:button.dataset.size,icon:button.dataset.icon})));
  byId('localFileButton').addEventListener('click',()=>{fileInput.value='';fileInput.click()});
  fileInput.addEventListener('change',()=>{const file=fileInput.files&&fileInput.files[0];if(file)openResource({source:'local',name:file.name,size:`${Math.max(1,Math.round(file.size/1024))} KB`,icon:'📄'})});
  document.querySelectorAll('[name="targetSlot"]').forEach(input=>input.addEventListener('change',()=>{targetSlot=input.value;targetCurrent=input.dataset.current;byId('installButton').disabled=false;byId('installButton').textContent=resource.source==='cloud'?`下载并替换“${targetCurrent}”`:`替换“${targetCurrent}”并推送`}));
  const beginTransfer=()=>{prepareView.hidden=true;transferView.hidden=false;let value=0;byId('progressBar').value=0;byId('progressPercent').textContent='0%';byId('progressText').textContent=`正在推送到槽位 ${targetSlot}`;transferTimer=setInterval(()=>{value=Math.min(100,value+4);byId('progressBar').value=value;byId('progressPercent').textContent=`${value}%`;if(value===100){clearInterval(transferTimer);byId('progressText').textContent='正在刷新设备运动…';finishTimer=setTimeout(()=>{const row=document.querySelector(`[data-device-slot="${targetSlot}"]`),installedName=resource.source==='cloud'?resource.name:'新运动',slotInput=document.querySelector(`[name="targetSlot"][value="${targetSlot}"]`);row.querySelector('strong').textContent=installedName;row.querySelector('small').textContent=resource.source==='cloud'?'云端运动 · 安装成功':'本地资源 · 设备回读完成';slotInput.dataset.current=installedName;slotInput.closest('.slot-option').querySelector('strong').textContent=installedName;setResult(`${installedName}安装成功`,`已替换${targetCurrent} · 槽位 ${targetSlot}`);overlay.hidden=true},600)}},90)};
  byId('installButton').addEventListener('click',()=>{if(!resource||!targetSlot)return;confirmView.hidden=true;operationView.hidden=false;byId('closeButton').hidden=true;transferView.hidden=true;prepareView.hidden=resource.source!=='cloud';setResult(resource.source==='cloud'?'正在准备云端运动':'正在推送本地运动',`${resource.name} → 槽位 ${targetSlot}`);if(resource.source==='cloud')prepareTimer=setTimeout(beginTransfer,1000);else beginTransfer()});
  const cancel=()=>{clearTimeout(prepareTimer);clearInterval(transferTimer);clearTimeout(finishTimer);overlay.hidden=true;setResult('推送已取消',targetSlot?`槽位 ${targetSlot} 未发生变化`:'未开始安装')};
  byId('cancelButton').addEventListener('click',cancel);byId('closeButton').addEventListener('click',()=>overlay.hidden=true);overlay.addEventListener('click',event=>{if(event.target===overlay&&operationView.hidden)overlay.hidden=true});
  byId('refreshButton').addEventListener('click',event=>{const button=event.currentTarget;button.disabled=true;button.textContent='刷新中…';byId('deviceDetail').textContent='正在加载云端运动和设备槽位…';setTimeout(()=>{button.disabled=false;button.textContent='刷新';byId('deviceDetail').textContent='支持运动推送 · 2 个槽位可替换';setResult('资源和槽位刷新成功','云端运动 6 个 · 可替换槽位 2 个')},700)});
  document.addEventListener('keydown',event=>{if(event.key==='Escape'&&operationView.hidden)overlay.hidden=true});
})();
</script>
</body>
</html>
