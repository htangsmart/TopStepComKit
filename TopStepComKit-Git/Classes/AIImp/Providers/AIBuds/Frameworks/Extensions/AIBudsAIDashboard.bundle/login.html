<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIBudsClaw - 登录</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="logo-section">
                <div class="logo">
                    <div class="claw-icon">
                        <svg width="80" height="80" viewBox="0 0 100 100" fill="none">
                            <circle cx="50" cy="50" r="45" fill="url(#gradient)" opacity="0.8"/>
                            <path d="M30 30L40 20L50 30L60 20L70 30L60 40L70 50L60 60L70 70L60 80L50 70L40 80L30 70L40 60L30 50L40 40Z" fill="white" opacity="0.9"/>
                            <path d="M45 35L55 35L55 45L65 45L65 55L55 55L55 65L45 65L45 55L35 55L35 45L45 45Z" fill="#007AFF"/>
                        </svg>
                        <defs>
                            <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#007AFF"/>
                                <stop offset="100%" stop-color="#6A11CB"/>
                            </linearGradient>
                        </defs>
                    </div>
                    <h1>AIBudsClaw</h1>
                    <p>AIBuds iOS SDK 智能分析系统</p>
                </div>
            </div>
            <div class="login-form">
                <form id="loginForm">
                    <div class="form-group">
                        <label for="username">账号</label>
                        <input type="text" id="username" name="username" placeholder="请输入账号" required>
                    </div>
                    <div class="form-group">
                        <label for="password">密码</label>
                        <div class="password-input-wrapper">
                            <input type="password" id="password" name="password" placeholder="请输入密码" required>
                            <button type="button" class="toggle-password" id="togglePassword" onclick="togglePasswordVisibility()">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                            </button>
                        </div>
                    </div>
                    
                    <!-- 数据源设置（可折叠） -->
                    <div class="data-source-section" id="dataSourceSection" style="display: none;">
                        <button type="button" class="data-source-toggle" id="collapseToggle">
                            <svg class="toggle-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="6 9 12 15 18 9"></polyline>
                            </svg>
                            <span>数据源配置</span>
                        </button>
                        <div class="data-source-content" id="collapseContent">
                            <div class="source-form">
                                <div class="source-input-group">
                                    <label for="deviceIp">设备 IP</label>
                                    <div class="input-field">
                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <path d="M12 20V10"></path>
                                            <path d="M18 20V4"></path>
                                            <path d="M6 20v-6"></path>
                                        </svg>
                                        <input type="text" id="deviceIp" name="deviceIp" placeholder="iOS 设备局域网 IP（如：192.168.1.100）">
                                    </div>
                                </div>
                                <div class="source-input-group">
                                    <label for="devicePort">端口</label>
                                    <div class="input-field">
                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <circle cx="12" cy="12" r="10"></circle>
                                            <circle cx="12" cy="12" r="6"></circle>
                                            <circle cx="12" cy="12" r="2"></circle>
                                        </svg>
                                        <input type="number" id="devicePort" name="devicePort" placeholder="iOS 设备端口（如：3000）" value="">
                                    </div>
                                </div>
                            </div>
                            <button type="button" class="source-save-btn" id="saveSettingsBtn">保存</button>
                        </div>
                    </div>
                    
                    <button type="submit" class="login-btn">登录</button>
                </form>
            </div>
        </div>
    </div>
    <div class="background-animation">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>
    <script src="js/config.js"></script>
    <script src="js/login.js"></script>
    <script>
        (function() {
            const params = new URLSearchParams(window.location.search);
            if (params.get('remote') === 'true') {
                document.getElementById('dataSourceSection').style.display = 'block';
            }
        })();
    </script>
</body>
</html>
